<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Siden har flyttet</title>
<link rel="canonical" href="https://eloisa-michaelsen.github.io/pfdk-moduler/">
<meta http-equiv="refresh" content="3;url=https://eloisa-michaelsen.github.io/pfdk-moduler/">
<style>
  :root{--bg:#0D3F1F;--ink:#F2FAF0;--soft:#C9DFCB;--pop:#FFC93C;--pop-ink:#1B2A10;}
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:var(--bg);color:var(--ink);font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;display:grid;place-items:center;padding:24px;}
  main{max-width:34rem;text-align:center;}
  h1{font-size:clamp(2rem,6vw,3rem);line-height:1.05;margin:0 0 16px;letter-spacing:-.02em;}
  p{font-size:1.1rem;line-height:1.6;color:var(--soft);margin:0 0 28px;}
  a.btn{display:inline-block;background:var(--pop);color:var(--pop-ink);font-weight:800;text-decoration:none;padding:14px 28px;border-radius:999px;font-size:1.05rem;}
  a.btn:hover{filter:brightness(1.07);}
  a.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px;}
  small{display:block;margin-top:22px;color:var(--soft);opacity:.8;font-size:.9rem;word-break:break-all;}
  small a{color:inherit;}
</style>
</head>
<body>
<main>
  <h1>Siden har flyttet</h1>
  <p>PfDK-modulene finner du nå på en ny adresse. Du blir sendt videre om et øyeblikk.</p>
  <a class="btn" id="go" href="https://eloisa-michaelsen.github.io/pfdk-moduler/">Gå til den nye siden</a>
  <small>Husk å oppdatere bokmerker og lenker.</small>
</main>
<script>
  var NEW_URL = "https://eloisa-michaelsen.github.io/pfdk-moduler/";
  {
    var target = NEW_URL + (location.hash || "");
    document.getElementById("go").href = target;
    location.replace(target);
  }
</script>
</body>
</html>
